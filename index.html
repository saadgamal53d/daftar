<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>دفتر حساباتي</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14231f;--mute:#76857f;--line:#e3eae7;--green:#0e9f6e;--greenbg:#e3f6ee;--red:#e0503f;--redbg:#fdeceb;--accent:#0b5d4b;--accent2:#12a37f;--shadow:0 6px 24px rgba(11,93,75,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;font-size:16px;padding-bottom:84px}
header{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;margin-top:calc(-1*env(safe-area-inset-top,0px));padding:calc(22px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 64px max(18px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-size:22px;font-weight:800}
header .tools{display:flex;gap:6px;flex-wrap:wrap}
header .tools button{background:#ffffff26;color:#fff;border:0;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;backdrop-filter:blur(6px)}
header .tools button:hover{background:#ffffff40}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;background:#fff;border-radius:40px;padding:6px;box-shadow:0 8px 30px rgba(11,93,75,.22);z-index:10;width:min(440px,calc(100% - 24px))}
nav button{flex:1;padding:10px 4px;border:0;background:none;font:inherit;font-size:14px;color:var(--mute);border-radius:30px;cursor:pointer;transition:.2s}
nav button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700}
main{max-width:860px;margin:-44px auto 0;padding:0 14px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow);text-align:center}
.stat small{color:var(--mute);display:block;font-size:13px}
.stat b{font-size:21px;font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,select,button{font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#f8fbfa;color:var(--ink);outline:none}
input:focus,select:focus{border-color:var(--accent2);background:#fff}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(18,163,127,.35)}
button.x{border:0;background:none;color:#c3cdc9;cursor:pointer;font-size:22px;padding:2px 8px}
button.x:hover{color:var(--red)}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--mute);font-weight:600;font-size:13px}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:var(--accent2);font-weight:700;text-decoration:none}
.scroll{overflow-x:auto}
.seg{display:flex;gap:8px;margin-bottom:12px;background:var(--bg);padding:5px;border-radius:16px}
.seg button{flex:1;cursor:pointer;border:0;background:none;font-weight:700;color:var(--mute);border-radius:12px}
.seg button.on.exp{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(224,80,63,.35)}
.seg button.on.inc{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(14,159,110,.35)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin-top:6px}
.bar i{display:block;height:100%}
.empty{color:var(--mute);text-align:center;padding:22px}
h2{font-size:17px;margin:0 0 12px;font-weight:800}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none}
.ic.inc{background:var(--greenbg);color:var(--green)}.ic.exp{background:var(--redbg);color:var(--red)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mid small{color:var(--mute);font-size:12.5px}
.chip{display:inline-block;background:var(--bg);color:var(--accent);border-radius:10px;padding:1px 8px;font-size:12px;margin-inline-end:6px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:17px}
.jrow td:first-child{color:var(--mute)}
.sub{padding-inline-start:22px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.acts{display:flex;flex:none}.x.ed{color:#9fb0aa;font-size:18px}.x.ed:hover{color:var(--accent2)}
.bh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{border:0;background:var(--bg);color:var(--accent);border-radius:20px;padding:6px 14px;cursor:pointer;font-weight:700}
.bud{margin-bottom:12px}.bt{display:flex;justify-content:space-between;gap:8px;font-size:14px}.bud .bar{height:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}.legend{flex:1;min-width:150px}
.lg{display:flex;align-items:center;padding:5px 0;font-size:14px}.lg span{flex:1}
.gbig{font-size:26px;font-weight:800;margin:6px 0}.gbig small{font-size:14px;color:var(--mute);font-weight:400}.gbig b{float:left;color:var(--accent2)}
nav button{font-size:13px}
#bk{position:fixed;inset:0;background:#0b5d4bd9;z-index:90;display:grid;place-items:center;padding:16px}#bk[hidden]{display:none}#bk .box{background:#fff;border-radius:22px;padding:20px;width:min(440px,100%);text-align:center}#bk textarea{width:100%;font:13px monospace;direction:ltr;border:1.5px solid var(--line);border-radius:12px;padding:10px}#bk button{width:100%;margin-top:8px;cursor:pointer}#bkE{min-height:22px;font-size:14px}
#ov{position:fixed;inset:0;background:linear-gradient(135deg,#0b5d4bf2,#12a37ff2);z-index:100;display:grid;place-items:center;backdrop-filter:blur(14px)}
#ov[hidden]{display:none}
#ov .box{background:#fff;border-radius:24px;padding:26px 22px;width:min(330px,90%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#ov input{width:100%;text-align:center;font-size:26px;letter-spacing:8px;margin:8px 0}
#ov button{width:100%;margin-top:8px;cursor:pointer}#ovE{min-height:22px;font-size:14px}
body.locked main,body.locked nav,body.locked header{filter:blur(12px);pointer-events:none}
@media(max-width:520px){.stat b{font-size:17px}header{padding-bottom:58px}}
</style>
</head>

/* ---------- home ---------- */
function months(){return [...new Set(db.tx.map(t=>t.date.slice(0,7)))].sort().reverse()}
function renderHome(){
  const inc=db.tx.filter(t=>t.kind==='inc').reduce((a,t)=>a+t.amount,0);
  const exp=db.tx.filter(t=>t.kind==='exp').reduce((a,t)=>a+t.amount,0);
  const rows=months().map(m=>{
    const i=db.tx.filter(t=>t.date.startsWith(m)&&t.kind==='inc').reduce((a,t)=>a+t.amount,0);
    const e=db.tx.filter(t=>t.date.startsWith(m)&&t.kind==='exp').reduce((a,t)=>a+t.amount,0);
    const tot=i+e||1;
    return `<tr><td>${mname(m)}<div class="bar"><i style="width:${i/tot*100}%;background:var(--green)"></i><i style="width:${e/tot*100}%;background:var(--red)"></i></div></td>
    <td class="n pos">${fmt(i)}</td><td class="n neg">${fmt(e)}</td><td class="n ${i-e<0?'neg':'pos'}">${fmt(i-e)}</td></tr>`}).join('');
  const byCat={};db.tx.filter(t=>t.kind==='exp').forEach(t=>byCat[t.cat||'بدون تصنيف']=(byCat[t.cat||'بدون تصنيف']||0)+t.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<tr><td>${esc(c)}</td><td class="n neg">${fmt(v)}</td><td class="n">${Math.round(v/exp*100)}%</td></tr>`).join('');

   <div class="stat"><small>إجمالي الدخل</small><b class="pos">${fmt(inc)}</b></div>
   <div class="stat"><small>إجمالي المصاريف</small><b class="neg">${fmt(exp)}</b></div>
   <div class="stat"><small>الباقي</small><b class="${inc-exp<0?'neg':'pos'}">${fmt(inc-exp)}</b></div>

  ${chartMonths()}
  ${chartCats(byCat,exp)}
  <div class="card"><h2>الشهور</h2>${rows?`<div class="scroll"><table><tr><th>الشهر</th><th>دخل</th><th>مصاريف</th><th>الباقي</th></tr>${rows}</table></div>`:'<div class="empty">لسه مفيش حركات — ابدأ من تبويب «الحركات»</div>'}</div>

const PAL=['#0b5d4b','#12a37f','#e69a1f','#e0503f','#1f4e8c','#8e5bd1','#d6679a','#6b7f78'];
function chartCats(byCat,exp){

  const leg=top.map(([n,v],i)=>`<div class="lg"><i class="dot" style="background:${PAL[i%8]}"></i><span>${esc(n)}</span><b>${Math.round(v/exp*100)}%</b></div>`).join('');

/* ---------- PIN lock ---------- */
const sure=async m=>(await ask(m,{input:false,cancel:true,buttons:[['نعم، متأكد','y']]}))==='y';
const PKEY='daftar-pin';
const getPin=()=>JSON.parse(ls.get(PKEY)||'null');
async function hashPin(pin,salt){const d=salt+':'+pin;
  if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(d));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let x=5381;for(const c of d)x=((x<<5)+x+c.charCodeAt(0))>>>0;return 'f'+x}
function ask(title,{input=true,buttons=[],cancel=false,err=''}={}){return new Promise(res=>{
  $('#ovT').textContent=title;$('#ovE').textContent=err;const i=$('#ovI');i.value='';i.hidden=!input;$('#ov').hidden=false;
  const B=$('#ovB');B.innerHTML='';
  const done=v=>{$('#ov').hidden=true;res(v)};
  if(input){const ok=document.createElement('button');ok.className='primary';ok.textContent='تأكيد';ok.onclick=()=>i.value?done(i.value):0;B.append(ok);i.onkeydown=e=>{if(e.key==='Enter')ok.click()};setTimeout(()=>i.focus(),50)}
  buttons.forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>done(v);B.append(b)});
  if(cancel){const c=document.createElement('button');c.textContent='إلغاء';c.onclick=()=>done(null);B.append(c)}})}
async function verify(title,cancel){let err='';for(;;){const v=await ask(title,{cancel,err});if(v===null)return false;
  const p=getPin();if(await hashPin(v,p.salt)===p.hash)return true;err='الرقم غلط، حاول تاني'}}
async function setPin(){let err='';for(;;){
  const a=await ask('اختار رقم سري (4 أرقام على الأقل)',{cancel:true,err});if(a===null)return;
  if(a.length<4){err='لازم 4 أرقام أو أكتر';continue}
  const b=await ask('اكتب الرقم تاني للتأكيد',{cancel:true});if(b===null)return;
  if(a!==b){err='الرقمين مش متطابقين';continue}
  const salt=Math.random().toString(36).slice(2);ls.set(PKEY,JSON.stringify({salt,hash:await hashPin(a,salt)}));syncLock();return}}
function syncLock(){$('#lockNow').hidden=!getPin()}
async function lock(){if(!getPin())return;document.body.classList.add('locked');await verify('🔒 دفتر حساباتي — اكتب الرقم السري',false);document.body.classList.remove('locked')}
$('#lockNow').onclick=lock;
$('#pinBtn').onclick=async()=>{
  if(!getPin())return setPin();
  if(!await verify('اكتب الرقم السري الحالي',true))return;
  const c=await ask('الرقم السري',{input:false,cancel:true,buttons:[['تغيير الرقم','chg'],['إلغاء القفل','rm']]});
  if(c==='chg')await setPin();else if(c==='rm'){ls.del(PKEY);syncLock()}};
let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(getPin()&&hiddenAt&&Date.now()-hiddenAt>60000&&$('#ov').hidden)lock()});
syncLock();if(getPin())lock();
</script>
